<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Dictation</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="/">Pianissimo <span>offline</span></a>
    <span class="net" id="net">Checking network</span>
  </header>

  <h1>Offline dictation</h1>
  <p class="lede">Swedish speech to text as you speak. The audio stays on this computer.</p>

  <div class="dictate card" id="out"><span class="empty">Press Start and say something.</span></div>

  <div class="controls">
    <button class="primary" id="toggle">Start</button>
    <button id="copy" disabled>Copy text</button>
    <button id="clear" disabled>Clear</button>
    <span class="meter" title="Microphone level"><i id="level"></i></span>
    <span class="hint" id="info"></span>
  </div>
</div>

<script type="module">
import { watchNetwork } from '/static/net.js'

const $ = (id) => document.getElementById(id)
watchNetwork($('net'))

const RATE = 16000
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let finals = []
let tentative = ''
let lastFinal = -1
let ws = null, audio = null, stream = null

function draw() {
  const said = finals.join(' ')
  if (!said && !tentative) {
    $('out').innerHTML = ws
      ? '<span class="empty"><span class="rec"></span>Listening</span>'
      : '<span class="empty">Press Start and say something.</span>'
  } else {
    $('out').innerHTML = esc(said) + (tentative ? ' <span class="tentative">' + esc(tentative) + '</span>' : '')
  }
  $('copy').disabled = $('clear').disabled = !said
}

async function start() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  })
  ws = new WebSocket(`ws://${location.host}/ws/dictate`)
  ws.binaryType = 'arraybuffer'
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data)
    if (m.type === 'partial') {
      // A partial can land after its own segment was finalised. Drop it.
      if (m.segment > lastFinal) tentative = m.text
    } else if (m.type === 'final') {
      lastFinal = m.segment
      tentative = ''
      if (m.text) {
        finals.push(m.text)
        $('info').textContent = `${m.audioSeconds.toFixed(1)} s of speech, text in ${m.ms} ms`
      }
    }
    draw()
  }
  await new Promise((ok, fail) => { ws.onopen = ok; ws.onerror = fail })

  audio = new AudioContext()
  await audio.audioWorklet.addModule('/static/pcm-worklet.js')
  const src = audio.createMediaStreamSource(stream)
  const node = new AudioWorkletNode(audio, 'pcm-worklet', { processorOptions: { targetRate: RATE } })
  node.port.onmessage = (e) => {
    if (ws?.readyState === 1) ws.send(e.data)
    const pcm = new Int16Array(e.data)
    let peak = 0
    for (let i = 0; i < pcm.length; i++) peak = Math.max(peak, Math.abs(pcm[i]))
    $('level').style.width = Math.min(100, (peak / 32768) * 180) + '%'
  }
  src.connect(node)
  // Keep the worklet pulling without playing the mic back through the speakers.
  const mute = audio.createGain()
  mute.gain.value = 0
  node.connect(mute).connect(audio.destination)

  $('toggle').textContent = 'Stop'
  draw()
}

async function stop() {
  stream?.getTracks().forEach((t) => t.stop())
  await audio?.close()
  if (ws?.readyState === 1) {
    ws.send(JSON.stringify({ type: 'stop' }))
    // Give the last segment a moment to come back before closing.
    await new Promise((r) => setTimeout(r, 1500))
    ws.close()
  }
  ws = audio = stream = null
  tentative = ''
  $('level').style.width = '0'
  $('toggle').textContent = 'Start'
  draw()
}

$('toggle').onclick = async () => {
  $('toggle').disabled = true
  try { ws ? await stop() : await start() }
  catch (err) { $('info').textContent = 'Could not start: ' + err.message; await stop() }
  finally { $('toggle').disabled = false }
}
$('copy').onclick = async () => {
  await navigator.clipboard.writeText(finals.join(' '))
  $('copy').textContent = 'Copied'
  setTimeout(() => { $('copy').textContent = 'Copy text' }, 1200)
}
$('clear').onclick = () => { finals = []; tentative = ''; draw() }
</script>
</body>
</html>
