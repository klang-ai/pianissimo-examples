<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Archive</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="/">Pianissimo <span>local</span></a>
    <span class="net" id="net">Checking network</span>
  </header>

  <h1>Show archive</h1>
  <p class="lede">Every episode of a show, transcribed on this computer in the background. Search all of them and play from the hit.</p>

  <form class="find" id="add">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
      placeholder="A show on Apple Podcasts, an RSS feed, or its name">
    <select id="limit" aria-label="How many episodes">
      <option value="5">5 latest</option>
      <option value="10" selected>10 latest</option>
      <option value="25">25 latest</option>
      <option value="500">All</option>
    </select>
    <button class="primary" type="submit" id="add-btn">Add</button>
  </form>
  <p class="hint" id="add-msg" hidden></p>

  <div class="stats" id="stats">
    <div class="stat card"><span>Episodes</span><b id="n-eps">·</b></div>
    <div class="stat card"><span>Hours of audio</span><b id="n-hours">·</b></div>
    <div class="stat card"><span>Words</span><b id="n-words">·</b></div>
    <div class="stat card"><span>In the queue</span><b id="n-queue">·</b></div>
  </div>

  <form class="find search-all" id="search">
    <input id="sq" type="search" autocomplete="off" placeholder="Search every episode">
    <button class="primary" type="submit">Search</button>
  </form>
  <audio id="player" controls hidden></audio>
  <div class="hits" id="hits"></div>

  <p class="label queue-label">Episodes</p>
  <div class="queue" id="queue"></div>
  <p class="hint" id="root"></p>
</div>

<script type="module">
import { watchNetwork } from '/static/net.js'

const $ = (id) => document.getElementById(id)
watchNetwork($('net'))
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const clock = (sec) => {
  sec = Math.max(0, Math.round(sec || 0))
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0')
}
const STATE = { queued: 'Queued', downloading: 'Downloading', transcribing: 'Transcribing', done: 'Done', error: 'Failed' }

async function refresh() {
  let data
  try { data = await (await fetch('/api/archive', { cache: 'no-store' })).json() } catch { return }
  const eps = data.episodes
  const done = eps.filter((e) => e.status === 'done')
  $('n-eps').textContent = done.length
  $('n-hours').textContent = (done.reduce((a, e) => a + (e.seconds || 0), 0) / 3600).toFixed(1)
  $('n-words').textContent = done.reduce((a, e) => a + (e.words || 0), 0).toLocaleString('en')
  $('n-queue').textContent = eps.length - done.length - eps.filter((e) => e.status === 'error').length
  $('root').textContent = 'Stored in ' + data.root
  $('queue').innerHTML = eps.slice().reverse().map((e) => {
    const pct = Math.round(100 * (e.progress || 0))
    const detail = e.status === 'done'
      ? `${clock(e.seconds)} in ${Math.round(e.transcribeSeconds)} s`
      : e.status === 'error' ? esc(e.error)
      : e.status === 'queued' ? '' : pct + ' %'
    return `<div class="row card ${e.status}">
      ${e.image ? `<img src="${esc(e.image)}" alt="">` : '<span class="noimg"></span>'}
      <span class="t"><b>${esc(e.title)}</b><small>${esc(e.show || '')}</small></span>
      <span class="s"><span class="pill">${STATE[e.status]}</span><small>${detail}</small></span>
      ${['downloading', 'transcribing'].includes(e.status) ? `<i class="p" style="width:${pct}%"></i>` : ''}
    </div>`
  }).join('') || '<p class="hint">Nothing here yet. Add a show above.</p>'
}
refresh()
setInterval(refresh, 1500)

$('add').addEventListener('submit', async (e) => {
  e.preventDefault()
  const q = $('q').value.trim()
  if (!q) return
  $('add-btn').disabled = true
  $('add-msg').hidden = false
  $('add-msg').textContent = 'Looking up the show…'
  try {
    const res = await fetch('/api/archive', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q, limit: $('limit').value }) })
    const d = await res.json()
    if (!res.ok) throw new Error(d.error)
    $('add-msg').textContent = `Found ${d.found} episodes, ${d.added} new in the queue.`
    $('q').value = ''
    refresh()
  } catch (err) {
    $('add-msg').textContent = err.message
  } finally {
    $('add-btn').disabled = false
  }
})

// The same small words the server ignores when it ranks.
const STOP = new Set('att och det som en ett är på i av för med till den de dom har inte om vi jag du han hon man kan ska så men vad hur när var eller också bara'.split(' '))
function highlight(text, q) {
  const stems = q.toLowerCase().match(/[\p{L}\p{N}]+/gu)?.filter((w) => w.length > 1 && !STOP.has(w)).map((w) => w.slice(0, 5)) || []
  return esc(text).replace(/[\p{L}\p{N}]+/gu, (w) => stems.some((s) => w.toLowerCase().startsWith(s)) ? `<mark>${w}</mark>` : w)
}

$('search').addEventListener('submit', async (e) => {
  e.preventDefault()
  const q = $('sq').value.trim()
  if (!q) return
  const t0 = performance.now()
  const { hits } = await (await fetch('/api/archive/search?q=' + encodeURIComponent(q))).json()
  const ms = Math.round(performance.now() - t0)
  $('hits').innerHTML = `<p class="hint">${hits.length} hits in ${ms} ms</p>` + hits.map((h) => `
    <button class="hit card" data-audio="${esc(h.audio)}" data-t="${h.start}">
      <span class="where"><span class="ts">${clock(h.start)}</span>${esc(h.title)}<small>${esc(h.show || '')}</small></span>
      <span class="said">${highlight(h.text, q)}</span>
    </button>`).join('')
})

$('hits').addEventListener('click', (e) => {
  const b = e.target.closest('.hit')
  if (!b) return
  const p = $('player')
  const src = '/archive-media/' + b.dataset.audio
  if (!p.src.endsWith(src)) p.src = src
  p.hidden = false
  const go = () => { p.currentTime = Number(b.dataset.t); p.play() }
  p.readyState >= 1 ? go() : p.addEventListener('loadedmetadata', go, { once: true })
})
</script>
</body>
</html>
