<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare Episodes</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="/">Pianissimo <span>local</span></a>
    <span class="net" id="net">Checking network</span>
  </header>

  <h1>Compare two episodes</h1>
  <p class="lede">Two episodes on one subject, both transcribed on this computer. What they agree on, where they differ, and what only one brings up.</p>

  <div class="sides">
    <section class="side card" data-side="A">
      <p class="label">Episode A</p>
      <form class="find pick"><input type="text" placeholder="Link or episode name" autocomplete="off"><button type="submit">Find</button></form>
      <select hidden></select>
      <p class="hint status"></p>
      <div class="bar" hidden><i></i></div>
      <audio controls hidden></audio>
    </section>
    <section class="side card" data-side="B">
      <p class="label">Episode B</p>
      <form class="find pick"><input type="text" placeholder="Link or episode name" autocomplete="off"><button type="submit">Find</button></form>
      <select hidden></select>
      <p class="hint status"></p>
      <div class="bar" hidden><i></i></div>
      <audio controls hidden></audio>
    </section>
  </div>
  <div class="controls"><button class="primary" id="go" disabled>Compare</button><span class="hint" id="clock"></span></div>

  <section class="pane card summary result" id="result" hidden></section>
</div>

<script type="module">
import { watchNetwork } from '/static/net.js'

const $ = (id) => document.getElementById(id)
watchNetwork($('net'))
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const clock = (sec) => {
  sec = Math.max(0, Math.round(sec || 0))
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0')
}
const toSeconds = (t) => t.split(':').map(Number).reduce((a, b) => a * 60 + b, 0)
const sides = Object.fromEntries([...document.querySelectorAll('.side')].map((el) => [el.dataset.side, { el, items: [] }]))
const chosen = (tag) => sides[tag].items[Number(sides[tag].el.querySelector('select').value)]
const ready = () => { $('go').disabled = !(chosen('A') && chosen('B')) }

for (const [tag, s] of Object.entries(sides)) {
  s.el.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const q = s.el.querySelector('input').value.trim()
    if (!q) return
    const status = s.el.querySelector('.status')
    status.textContent = 'Looking…'
    const res = await fetch('/api/resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q }) })
    const d = await res.json()
    if (!res.ok) { status.textContent = d.error; return }
    s.items = d.items
    const sel = s.el.querySelector('select')
    sel.innerHTML = d.items.map((it, i) => `<option value="${i}">${esc(it.title)}${it.show ? ' · ' + esc(it.show) : ''}${it.duration ? ' · ' + clock(it.duration) : ''}</option>`).join('')
    sel.hidden = false
    status.textContent = 'Found through ' + d.items[0].via + '.'
    ready()
  })
  s.el.querySelector('select').addEventListener('change', ready)
}

// [A 12:30] and [B 4:00] become buttons that play that side from there.
function render(md) {
  const inline = (x) => esc(x).replace(/\[([AB]) (\d{1,3}:\d{2}(?::\d{2})?)\]/g,
    (_, tag, t) => `<button class="ts side-${tag}" data-side="${tag}" data-t="${toSeconds(t)}">${tag} ${t}</button>`)
  const out = []
  let list = false
  for (const line of md.split('\n').map((l) => l.trimEnd())) {
    if (/^- /.test(line)) { if (!list) { out.push('<ul>'); list = true } out.push('<li>' + inline(line.slice(2)) + '</li>'); continue }
    if (list) { out.push('</ul>'); list = false }
    if (!line) continue
    if (line.startsWith('## ')) out.push('<h3>' + inline(line.slice(3)) + '</h3>')
    else if (line.startsWith('# ')) out.push('<h2>' + inline(line.slice(2)) + '</h2>')
    else out.push('<p>' + inline(line) + '</p>')
  }
  if (list) out.push('</ul>')
  return out.join('')
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('.ts[data-side]')
  if (!b) return
  const p = sides[b.dataset.side].el.querySelector('audio')
  if (!p.src) return
  p.currentTime = Number(b.dataset.t)
  p.play()
})

$('go').addEventListener('click', async () => {
  $('go').disabled = true
  const t0 = performance.now()
  const tick = setInterval(() => { $('clock').textContent = Math.round((performance.now() - t0) / 1000) + ' s' }, 250)
  let text = ''
  $('result').hidden = false
  $('result').innerHTML = '<p class="hint">Transcribing both episodes. The comparison starts when both are done.</p>'
  const res = await fetch('/api/compare', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a: chosen('A'), b: chosen('B') }) })
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader()
  let buf = ''
  const lengths = {}
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    buf += value
    let nl
    while ((nl = buf.indexOf('\n')) >= 0) {
      const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1)
      const s = ev.side && sides[ev.side]
      const status = s?.el.querySelector('.status'), bar = s?.el.querySelector('.bar')
      if (ev.type === 'download') { bar.hidden = false; bar.firstElementChild.style.width = ev.total ? (100 * ev.done / ev.total) + '%' : '0'; status.textContent = 'Downloading' }
      else if (ev.type === 'job') { const a = s.el.querySelector('audio'); a.src = ev.media; a.hidden = false }
      else if (ev.type === 'start') { lengths[ev.side] = ev.audioSeconds; status.textContent = `Transcribing ${clock(ev.audioSeconds)}` }
      else if (ev.type === 'progress') bar.firstElementChild.style.width = (100 * ev.done / ev.total) + '%'
      else if (ev.type === 'chapter') status.textContent = `Chapter at ${clock(ev.start)}: ${ev.title}`
      else if (ev.type === 'done' && s) { bar.hidden = true; status.textContent = `Done: ${clock(lengths[ev.side])} in ${Math.round(ev.totalSeconds)} s` }
      else if (ev.type === 'compare') { text += ev.text; $('result').innerHTML = render(text) + '<span class="caret"></span>' }
      else if (ev.type === 'compare-done') $('result').innerHTML = render(text)
      else if (ev.type === 'error') $('result').innerHTML = '<p class="hint">' + esc(ev.message) + '</p>'
    }
  }
  clearInterval(tick)
  $('go').disabled = false
})
</script>
</body>
</html>
